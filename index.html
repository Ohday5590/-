<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ກະປຸກ — ออมเพื่อฝัน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Kanit:wght@300;600;700&display=swap');

:root {
–cream: #fdf6ed;
–warm: #f5ede0;
–warm2: #ede0ce;
–orange: #f4845f;
–orange-deep: #e05c35;
–teal: #2d9c8e;
–teal-light: #e6f5f3;
–yellow: #f7c948;
–kip-color: #e07b39;
–kip-bg: #fff4ed;
–baht-color: #1a6fb5;
–baht-bg: #edf4ff;
–text: #1a1208;
–text2: #7a6a55;
–text3: #b8a896;
–card: #ffffff;
–red: #e74c3c;
–green: #27ae60;
–shadow-sm: 0 2px 12px rgba(26,18,8,0.08);
–radius: 20px;
–radius-sm: 12px;
}

- { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(–cream); color:var(–text); font-family:‘Mitr’,sans-serif; }

/* APP */
.app { display:flex; flex-direction:column; height:100vh; max-width:430px; margin:0 auto; background:var(–cream); position:relative; }

/* HEADER */
.header { padding:52px 20px 0; flex-shrink:0; }
.header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.app-title { font-family:‘Kanit’,sans-serif; font-size:26px; font-weight:700; }
.app-title span { color:var(–orange); }

/* SUMMARY CARD */
.summary-card {
background:var(–orange); border-radius:var(–radius);
padding:18px 20px; margin-bottom:6px;
position:relative; overflow:hidden;
}
.summary-card::after {
content:‘🐖’; position:absolute; right:-6px; bottom:-10px;
font-size:78px; opacity:0.15; transform:scaleX(-1); pointer-events:none;
}
.summary-label { font-size:11px; color:rgba(255,255,255,0.7); letter-spacing:.5px; margin-bottom:10px; }
.summary-row { display:flex; gap:20px; align-items:flex-end; margin-bottom:12px; }
.summary-block {}
.summary-cur { font-size:11px; color:rgba(255,255,255,0.65); margin-bottom:1px; }
.summary-amt { font-family:‘Kanit’,sans-serif; font-size:26px; font-weight:700; color:#fff; line-height:1; }
.summary-divider { width:1px; background:rgba(255,255,255,0.25); align-self:stretch; margin-bottom:2px; }
.summary-stats { display:flex; gap:10px; }
.stat-pill { background:rgba(255,255,255,0.18); border-radius:20px; padding:4px 11px; font-size:12px; color:#fff; }

/* SCROLL */
.scroll-area { flex:1; overflow-y:auto; padding:14px 16px 110px; -webkit-overflow-scrolling:touch; }
.scroll-area::-webkit-scrollbar { display:none; }
.sec-label { font-size:11px; font-weight:600; color:var(–text3); letter-spacing:1px; text-transform:uppercase; margin:14px 4px 10px; }

/* GOAL CARD */
.goal-card {
background:var(–card); border-radius:var(–radius);
padding:18px 18px 14px; margin-bottom:12px;
box-shadow:var(–shadow-sm);
border:1.5px solid transparent;
position:relative; overflow:hidden;
animation:slideUp .35s ease both;
transition:border-color .3s;
}
.goal-card.done { border-color:var(–teal); }
.goal-card::before {
content:’’; position:absolute; left:0; top:0; bottom:0;
width:4px; background:var(–orange); border-radius:4px 0 0 4px; transition:background .3s;
}
.goal-card.done::before { background:var(–teal); }
@keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* GOAL TOP ROW */
.goal-top { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
.goal-icon { width:46px; height:46px; border-radius:13px; background:var(–warm); display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
.goal-card.done .goal-icon { background:var(–teal-light); }
.goal-meta { flex:1; min-width:0; }
.goal-name { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
.goal-sub { font-size:12px; color:var(–text2); }
.done-badge { background:var(–teal-light); color:var(–teal); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:600; flex-shrink:0; }

/* DUAL CURRENCY SAVED */
.dual-saved {
display:flex; gap:8px; margin-bottom:12px;
}
.cur-saved-block {
flex:1; border-radius:var(–radius-sm); padding:10px 12px;
}
.cur-saved-block.kip { background:var(–kip-bg); }
.cur-saved-block.baht { background:var(–baht-bg); }
.csb-label { font-size:10px; font-weight:600; letter-spacing:.5px; margin-bottom:2px; }
.cur-saved-block.kip .csb-label { color:var(–kip-color); }
.cur-saved-block.baht .csb-label { color:var(–baht-color); }
.csb-saved { font-family:‘Kanit’,sans-serif; font-size:18px; font-weight:700; line-height:1; }
.cur-saved-block.kip .csb-saved { color:var(–kip-color); }
.cur-saved-block.baht .csb-saved { color:var(–baht-color); }
.csb-target { font-size:11px; color:var(–text3); margin-top:1px; }

/* COMBINED PROGRESS */
.progress-section { margin-bottom:12px; }
.progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.progress-label { font-size:12px; color:var(–text2); }
.progress-pct { font-size:13px; font-weight:600; color:var(–orange); }
.goal-card.done .progress-pct { color:var(–teal); }
.progress-track { height:8px; background:var(–warm); border-radius:8px; overflow:hidden; }
.progress-fill {
height:100%; border-radius:8px;
background:linear-gradient(90deg,var(–orange),var(–yellow));
transition:width .7s cubic-bezier(.34,1.4,.64,1);
}
.goal-card.done .progress-fill { background:linear-gradient(90deg,var(–teal),#5ec2b7); }
.progress-remain { font-size:11px; color:var(–text3); margin-top:5px; text-align:right; }

/* ACTION BTNS */
.goal-actions { display:flex; gap:8px; }
.action-btn {
flex:1; padding:10px 0; border-radius:var(–radius-sm);
border:none; font-family:‘Mitr’,sans-serif; font-size:14px; font-weight:500;
cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px;
transition:all .2s;
}
.action-btn:active { transform:scale(.95); }
.btn-kip { background:var(–kip-bg); color:var(–kip-color); }
.btn-baht { background:var(–baht-bg); color:var(–baht-color); }
.btn-withdraw { background:var(–warm); color:var(–text2); border:1.5px solid rgba(26,18,8,.08); }
.btn-del { flex:0; width:40px; background:#fff2f1; color:var(–red); border:1.5px solid rgba(231,76,60,.12); }

/* EMPTY */
.empty { text-align:center; padding:50px 20px; }
.empty-pig { font-size:64px; margin-bottom:14px; animation:bounce 2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.empty-title { font-family:‘Kanit’,sans-serif; font-size:20px; font-weight:600; margin-bottom:6px; }
.empty-sub { font-size:14px; color:var(–text2); line-height:1.7; }

/* BOTTOM NAV */
.bottom-nav {
position:absolute; bottom:0; left:0; right:0;
background:rgba(253,246,237,.97); backdrop-filter:blur(14px);
border-top:1.5px solid rgba(244,132,95,.12);
display:flex; padding:10px 0 28px; z-index:50;
}
.nav-item {
flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
cursor:pointer; padding:8px 0; color:var(–text3); font-size:10px; transition:color .2s;
}
.nav-item.active { color:var(–orange); }
.nav-icon { font-size:22px; }
.nav-fab {
width:54px; height:54px; border-radius:16px;
background:var(–orange); color:#fff; border:none; font-size:28px;
cursor:pointer; box-shadow:0 6px 20px rgba(244,132,95,.45);
display:flex; align-items:center; justify-content:center;
margin-top:-20px; transition:transform .2s;
}
.nav-fab:active { transform:scale(.92); }

/* OVERLAY + SHEET */
.overlay { position:fixed; inset:0; background:rgba(26,18,8,.44); backdrop-filter:blur(4px); z-index:200; opacity:0; pointer-events:none; transition:opacity .3s; }
.overlay.open { opacity:1; pointer-events:all; }
.sheet {
position:fixed; bottom:0; left:50%; transform:translate(-50%,110%);
width:100%; max-width:430px;
background:var(–card); border-radius:28px 28px 0 0;
padding:16px 20px 48px; z-index:300;
transition:transform .38s cubic-bezier(.32,1.1,.64,1);
max-height:92vh; overflow-y:auto;
}
.sheet.open { transform:translate(-50%,0); }
.sheet-handle { width:36px; height:4px; background:#e8ddd2; border-radius:4px; margin:0 auto 20px; }
.sheet-title { font-family:‘Kanit’,sans-serif; font-size:22px; font-weight:700; margin-bottom:20px; }

/* FORM */
.form-group { margin-bottom:15px; }
.form-label { font-size:12px; font-weight:600; color:var(–text2); letter-spacing:.4px; margin-bottom:7px; display:block; }
.form-input {
width:100%; padding:13px 15px; border-radius:var(–radius-sm);
border:1.5px solid #ede3d8; background:var(–cream);
font-family:‘Mitr’,sans-serif; font-size:15px; color:var(–text);
outline:none; transition:border-color .2s; -webkit-appearance:none;
}
.form-input:focus { border-color:var(–orange); }
.form-input::placeholder { color:var(–text3); }

/* DUAL INPUT ROW */
.dual-input-row { display:flex; gap:10px; }
.dual-input-row .form-group { flex:1; }
.input-kip { border-color:#f0d5c4 !important; background:var(–kip-bg) !important; }
.input-kip:focus { border-color:var(–kip-color) !important; }
.input-baht { border-color:#c4d9f0 !important; background:var(–baht-bg) !important; }
.input-baht:focus { border-color:var(–baht-color) !important; }
.input-kip::placeholder { color:#d4967a; }
.input-baht::placeholder { color:#7aaed4; }

/* CURRENCY LABEL */
.cur-label-kip { color:var(–kip-color) !important; }
.cur-label-baht { color:var(–baht-color) !important; }

/* EMOJI */
.emoji-row { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.emoji-chip { aspect-ratio:1; border-radius:12px; background:var(–warm); display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; border:2.5px solid transparent; transition:all .15s; }
.emoji-chip:active { transform:scale(.88); }
.emoji-chip.sel { border-color:var(–orange); background:var(–yellow-light,#fef9e7); }

/* QUICK CHIPS */
.quick-row { display:flex; gap:7px; margin-top:8px; flex-wrap:wrap; }
.quick-chip { padding:6px 11px; border-radius:20px; border:1.5px solid #ede3d8; background:var(–cream); font-family:‘Mitr’,sans-serif; font-size:11px; color:var(–text2); cursor:pointer; transition:all .15s; }
.quick-chip.kip { border-color:#f0d5c4; color:var(–kip-color); background:var(–kip-bg); }
.quick-chip.baht { border-color:#c4d9f0; color:var(–baht-color); background:var(–baht-bg); }
.quick-chip:active { opacity:.7; }

/* GOAL PREVIEW in TXN sheet */
.goal-preview { display:flex; align-items:center; gap:10px; background:var(–warm); border-radius:var(–radius-sm); padding:12px 14px; margin-bottom:18px; }
.gp-icon { font-size:26px; }
.gp-name { font-size:14px; font-weight:600; }
.gp-sub { font-size:12px; color:var(–text2); margin-top:2px; }

/* TXN TYPE TOGGLE */
.txn-cur-toggle { display:flex; gap:8px; margin-bottom:16px; }
.txn-cur-btn {
flex:1; padding:10px; border-radius:var(–radius-sm); border:1.5px solid;
font-family:‘Mitr’,sans-serif; font-size:14px; font-weight:500; cursor:pointer;
transition:all .2s; background:transparent;
}
.txn-cur-btn.kip { border-color:#f0d5c4; color:var(–kip-color); }
.txn-cur-btn.kip.sel { background:var(–kip-color); color:#fff; border-color:var(–kip-color); }
.txn-cur-btn.baht { border-color:#c4d9f0; color:var(–baht-color); }
.txn-cur-btn.baht.sel { background:var(–baht-color); color:#fff; border-color:var(–baht-color); }

/* BTNS */
.btn-primary { width:100%; padding:15px; border-radius:var(–radius-sm); border:none; background:var(–orange); color:#fff; font-family:‘Mitr’,sans-serif; font-size:16px; font-weight:500; cursor:pointer; margin-top:10px; box-shadow:0 4px 16px rgba(244,132,95,.3); transition:all .2s; }
.btn-primary:active { transform:scale(.97); background:var(–orange-deep); }
.btn-secondary { width:100%; padding:13px; border-radius:var(–radius-sm); border:1.5px solid #ede3d8; background:transparent; font-family:‘Mitr’,sans-serif; font-size:14px; color:var(–text2); cursor:pointer; margin-top:8px; }
.btn-danger { width:100%; padding:13px; border-radius:var(–radius-sm); border:none; background:#fff2f1; color:var(–red); font-family:‘Mitr’,sans-serif; font-size:14px; font-weight:500; cursor:pointer; margin-top:8px; }

/* HISTORY */
.history-item { display:flex; align-items:center; gap:12px; padding:13px 15px; background:var(–card); border-radius:var(–radius-sm); margin-bottom:8px; box-shadow:var(–shadow-sm); }
.hist-icon { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.hist-icon.kip-in { background:var(–kip-bg); }
.hist-icon.kip-out { background:#fff2f1; }
.hist-icon.baht-in { background:var(–baht-bg); }
.hist-icon.baht-out { background:#fff2f1; }
.hist-info { flex:1; min-width:0; }
.hist-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hist-sub { font-size:11px; color:var(–text3); margin-top:1px; }
.hist-amt { font-family:‘Kanit’,sans-serif; font-size:15px; font-weight:600; flex-shrink:0; }
.hist-amt.kip-in { color:var(–kip-color); }
.hist-amt.kip-out { color:var(–red); }
.hist-amt.baht-in { color:var(–baht-color); }
.hist-amt.baht-out { color:var(–red); }

/* CONFETTI */
.confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:999; }
.conf { position:absolute; width:8px; height:8px; border-radius:2px; animation:fall linear forwards; }
@keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

/* TOAST */
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(16px); background:var(–text); color:#fff; padding:11px 22px; border-radius:30px; font-size:13px; font-weight:500; z-index:500; opacity:0; transition:all .3s; white-space:nowrap; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.page { display:none; }
.page.active { display:block; }
</style>

</head>
<body>
<div class="app">

  <!-- HEADER -->

  <div class="header">
    <div class="header-row">
      <div class="app-title">ກະປຸກ<span>.</span></div>
      <div style="font-size:11px;color:var(--text3)">ເກັບໄດ້ທັງ ₭ + ฿</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">ຍອດລວມທີ່ເກັບໄດ້</div>
      <div class="summary-row">
        <div class="summary-block">
          <div class="summary-cur">ກີບ ₭</div>
          <div class="summary-amt" id="sumKip">0</div>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-block">
          <div class="summary-cur">ບາດ ฿</div>
          <div class="summary-amt" id="sumBaht">0</div>
        </div>
      </div>
      <div class="summary-stats">
        <div class="stat-pill">🎯 <span id="statGoals">0</span> ເປົ້າ</div>
        <div class="stat-pill">✅ <span id="statDone">0</span> ສຳເລັດ</div>
      </div>
    </div>
  </div>

  <!-- SCROLL -->

  <div class="scroll-area" id="scrollArea">
    <div class="page active" id="pageHome">
      <div class="sec-label">ເປົ້າໝາຍຂອງຂ້ອຍ</div>
      <div id="goalList"></div>
    </div>
    <div class="page" id="pageHistory">
      <div class="sec-label">ປະຫວັດການເກັບ</div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->

  <div class="bottom-nav">
    <div class="nav-item active" id="navHome" onclick="showPage('Home')">
      <div class="nav-icon">🏠</div><span>ໜ້າຫຼັກ</span>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;">
      <button class="nav-fab" id="fabBtn">+</button>
    </div>
    <div class="nav-item" id="navHistory" onclick="showPage('History')">
      <div class="nav-icon">📋</div><span>ປະຫວັດ</span>
    </div>
  </div>
</div>

<!-- ===== SHEET: NEW GOAL ===== -->

<div class="overlay" id="ovGoal" onclick="closeSheet('shGoal')"></div>
<div class="sheet" id="shGoal">
  <div class="sheet-handle"></div>
  <div class="sheet-title">✨ ຕັ້ງເປົ້າໝາຍໃໝ່</div>

  <div class="form-group">
    <label class="form-label">ຢາກໄດ້ຫຍັງ?</label>
    <input type="text" class="form-input" id="gName" placeholder="ເຊັ່ນ: iPhone 16, ກະເປົ໋າໃໝ່, ທ່ຽວ…" />
  </div>

  <div class="form-group">
    <label class="form-label">ເລືອກໄອຄອນ</label>
    <div class="emoji-row" id="emojiRow"></div>
  </div>

  <!-- DUAL TARGET -->

  <div class="form-group">
    <label class="form-label">ລາຄາເປົ້າໝາຍ <span style="color:var(--text3);font-weight:400">(ໃສ່ຢ່າງໜ້ອຍ 1 ສະກຸນ)</span></label>
    <div class="dual-input-row">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label cur-label-kip">₭ ກີບ</label>
        <input type="number" class="form-input input-kip" id="gTargetKip" placeholder="0" inputmode="numeric" />
        <div class="quick-row" id="quickKipGoal"></div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label cur-label-baht">฿ ບາດ</label>
        <input type="number" class="form-input input-baht" id="gTargetBaht" placeholder="0" inputmode="numeric" />
        <div class="quick-row" id="quickBahtGoal"></div>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">ວັນທີ່ຕ້ອງການ <span style="color:var(--text3);font-weight:400">(ທາງເລືອກ)</span></label>
    <input type="date" class="form-input" id="gDate" />
  </div>

<button class="btn-primary" onclick="saveGoal()">💾 ບັນທຶກເປົ້າໝາຍ</button>
<button class="btn-secondary" onclick="closeSheet('shGoal')">ຍົກເລີກ</button>

</div>

<!-- ===== SHEET: DEPOSIT / WITHDRAW ===== -->

<div class="overlay" id="ovTxn" onclick="closeSheet('shTxn')"></div>
<div class="sheet" id="shTxn">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="txnTitle">ຝາກເງິນ</div>
  <div class="goal-preview">
    <div class="gp-icon" id="txnIcon"></div>
    <div>
      <div class="gp-name" id="txnGoalName"></div>
      <div class="gp-sub" id="txnGoalInfo"></div>
    </div>
  </div>

  <!-- CURRENCY SELECTOR -->

  <div class="txn-cur-toggle">
    <button class="txn-cur-btn kip sel" id="tbKip" onclick="setTxnCur('KIP')">₭ ກີບ</button>
    <button class="txn-cur-btn baht" id="tbBaht" onclick="setTxnCur('THB')">฿ ບາດ</button>
  </div>

  <div class="form-group">
    <label class="form-label" id="txnAmtLabel">ຈຳນວນ (ກີບ)</label>
    <input type="number" class="form-input" id="txnAmt" placeholder="0" inputmode="numeric" />
    <div class="quick-row" id="txnQuickRow"></div>
  </div>

  <div class="form-group">
    <label class="form-label">ໝາຍເຫດ <span style="color:var(--text3);font-weight:400">(ທາງເລືອກ)</span></label>
    <input type="text" class="form-input" id="txnNote" placeholder="ເຊັ່ນ: ເງິນເດືອນ, ຂອງຂວັນ…" />
  </div>

<button class="btn-primary" id="txnConfirmBtn" onclick="confirmTxn()">ຢືນຢັນ ✓</button>
<button class="btn-secondary" onclick="closeSheet('shTxn')">ຍົກເລີກ</button>

</div>

<!-- ===== SHEET: DELETE ===== -->

<div class="overlay" id="ovDel" onclick="closeSheet('shDel')"></div>
<div class="sheet" id="shDel">
  <div class="sheet-handle"></div>
  <div class="sheet-title">🗑️ ລຶບເປົ້າໝາຍນີ້?</div>
  <p style="font-size:14px;color:var(--text2);margin-bottom:18px;line-height:1.7;">ຂໍ້ມູນທັງໝົດຈະຖືກລຶບ ແລະ ບໍ່ສາມາດກູ້ຄືນໄດ້</p>
  <div class="goal-preview" id="delPreview">
    <div class="gp-icon" id="delIcon"></div>
    <div>
      <div class="gp-name" id="delName"></div>
      <div class="gp-sub" id="delSaved"></div>
    </div>
  </div>
  <button class="btn-danger" onclick="confirmDelete()">ລຶບເລີຍ</button>
  <button class="btn-secondary" onclick="closeSheet('shDel')">ບໍ່ລຶບ</button>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA MODEL
// goal: { id, name, emoji, targetKip, targetBaht, savedKip, savedBaht, date }
// txn:  { id, goalId, type:'in'|'out', cur:'KIP'|'THB', amount, note, date }
// ============================================================

const EMOJIS = ['📱','💻','👜','👟','✈️','🏠','🚗','💎','🎮','📷','⌚','🎸','🏋️','🎓','🌴','💍','🎁','🛒','☕','🍜','🧳','🎯','🏖️','🎪'];
const QUICK_KIP  = [10000,50000,100000,500000,1000000];
const QUICK_BAHT = [20,50,100,500,1000];

let goals = JSON.parse(localStorage.getItem('gk3_goals') || '[]');
let txns  = JSON.parse(localStorage.getItem('gk3_txns')  || '[]');
let selEmoji = EMOJIS[0];
let txnGoalIdx = null, txnType = null, txnCur = 'KIP', delIdx = null;

function persist() {
  localStorage.setItem('gk3_goals', JSON.stringify(goals));
  localStorage.setItem('gk3_txns',  JSON.stringify(txns));
}

// ============================================================
// PAGES
// ============================================================
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page'+name).classList.add('active');
  document.getElementById('nav'+name).classList.add('active');
  if (name === 'History') renderHistory();
  document.getElementById('scrollArea').scrollTop = 0;
}

// ============================================================
// SHEETS
// ============================================================
function openSheet(id) {
  const key = id.replace('sh','ov');
  document.getElementById(key).classList.add('open');
  document.getElementById(id).classList.add('open');
}
function closeSheet(id) {
  const key = id.replace('sh','ov');
  document.getElementById(key).classList.remove('open');
  document.getElementById(id).classList.remove('open');
}

// ============================================================
// EMOJI
// ============================================================
function renderEmojiRow() {
  document.getElementById('emojiRow').innerHTML = EMOJIS.map(e =>
    `<div class="emoji-chip ${e===selEmoji?'sel':''}" onclick="pickEmoji('${e}')">${e}</div>`
  ).join('');
}
function pickEmoji(e) {
  selEmoji = e;
  document.querySelectorAll('.emoji-chip').forEach(c => c.classList.toggle('sel', c.textContent===e));
}

// ============================================================
// QUICK AMOUNTS
// ============================================================
function renderQuickPair(kipId, bahtId, kipInput, bahtInput) {
  const ke = document.getElementById(kipId);
  const be = document.getElementById(bahtId);
  if (ke) ke.innerHTML = QUICK_KIP.map(a =>
    `<div class="quick-chip kip" onclick="document.getElementById('${kipInput}').value=${a}">₭${a.toLocaleString('en')}</div>`
  ).join('');
  if (be) be.innerHTML = QUICK_BAHT.map(a =>
    `<div class="quick-chip baht" onclick="document.getElementById('${bahtInput}').value=${a}">฿${a.toLocaleString('en')}</div>`
  ).join('');
}

function renderTxnQuick() {
  const el = document.getElementById('txnQuickRow');
  const list = txnCur === 'KIP' ? QUICK_KIP : QUICK_BAHT;
  const sym  = txnCur === 'KIP' ? '₭' : '฿';
  const cls  = txnCur === 'KIP' ? 'kip' : 'baht';
  el.innerHTML = list.map(a =>
    `<div class="quick-chip ${cls}" onclick="document.getElementById('txnAmt').value=${a}">${sym}${a.toLocaleString('en')}</div>`
  ).join('');
}

// ============================================================
// NEW GOAL
// ============================================================
function openNewGoal() {
  document.getElementById('gName').value = '';
  document.getElementById('gTargetKip').value = '';
  document.getElementById('gTargetBaht').value = '';
  document.getElementById('gDate').value = '';
  selEmoji = EMOJIS[0];
  renderEmojiRow();
  renderQuickPair('quickKipGoal','quickBahtGoal','gTargetKip','gTargetBaht');
  openSheet('shGoal');
}
document.getElementById('fabBtn').onclick = openNewGoal;

function saveGoal() {
  const name = document.getElementById('gName').value.trim();
  const targetKip  = parseFloat(document.getElementById('gTargetKip').value)  || 0;
  const targetBaht = parseFloat(document.getElementById('gTargetBaht').value) || 0;
  const date = document.getElementById('gDate').value;
  if (!name) { showToast('ກະລຸນາໃສ່ຊື່ເປົ້າໝາຍ 😊'); return; }
  if (!targetKip && !targetBaht) { showToast('ໃສ່ລາຄາຢ່າງໜ້ອຍ 1 ສະກຸນ'); return; }
  goals.push({
    id: Date.now(), name, emoji: selEmoji,
    targetKip: Math.round(targetKip), targetBaht: Math.round(targetBaht),
    savedKip: 0, savedBaht: 0, date
  });
  persist(); closeSheet('shGoal'); render();
  showToast('✨ ສ້າງເປົ້າໝາຍສຳເລັດ!');
}

// ============================================================
// TRANSACTION
// ============================================================
function setTxnCur(c) {
  txnCur = c;
  document.getElementById('tbKip').classList.toggle('sel', c==='KIP');
  document.getElementById('tbBaht').classList.toggle('sel', c==='THB');
  document.getElementById('txnAmtLabel').textContent = c==='KIP' ? 'ຈຳນວນ (ກີບ ₭)' : 'ຈຳນວນ (ບາດ ฿)';
  document.getElementById('txnAmt').value = '';
  renderTxnQuick();
}

function openTxn(idx, type) {
  txnGoalIdx = idx; txnType = type;
  const g = goals[idx];
  const isIn = type === 'in';
  document.getElementById('txnTitle').textContent = isIn ? '💰 ຝາກເງິນ' : '💸 ຖອນເງິນ';
  document.getElementById('txnIcon').textContent = g.emoji;
  document.getElementById('txnGoalName').textContent = g.name;

  // show current saved
  let infoStr = '';
  if (g.savedKip)  infoStr += `₭${g.savedKip.toLocaleString('en')} `;
  if (g.savedBaht) infoStr += `฿${g.savedBaht.toLocaleString('en')}`;
  document.getElementById('txnGoalInfo').textContent = infoStr ? 'ເກັບໄດ້: ' + infoStr.trim() : 'ຍັງບໍ່ມີການເກັບ';

  const btn = document.getElementById('txnConfirmBtn');
  btn.textContent = isIn ? '💰 ຝາກ ✓' : '💸 ຖອນ ✓';
  btn.style.background = isIn ? 'var(--orange)' : 'var(--red)';

  document.getElementById('txnAmt').value = '';
  document.getElementById('txnNote').value = '';
  txnCur = 'KIP';
  document.getElementById('tbKip').classList.add('sel');
  document.getElementById('tbBaht').classList.remove('sel');
  document.getElementById('txnAmtLabel').textContent = 'ຈຳນວນ (ກີບ ₭)';
  renderTxnQuick();
  openSheet('shTxn');
}

function confirmTxn() {
  const raw = parseFloat(document.getElementById('txnAmt').value);
  const note = document.getElementById('txnNote').value.trim();
  if (!raw || raw <= 0) { showToast('ກະລຸນາໃສ່ຈຳນວນເງິນ'); return; }

  const g = goals[txnGoalIdx];
  const isKip = txnCur === 'KIP';
  const amt = Math.round(raw);

  if (txnType === 'in') {
    if (isKip) g.savedKip += amt;
    else g.savedBaht += amt;
  } else {
    if (isKip) {
      if (amt > g.savedKip) { showToast('ກີບໃນກ້ອງບໍ່ພໍ! 🐷'); return; }
      g.savedKip -= amt;
    } else {
      if (amt > g.savedBaht) { showToast('ບາດໃນກ້ອງບໍ່ພໍ! 🐷'); return; }
      g.savedBaht -= amt;
    }
  }

  const wasNotDone = !isGoalDone(g, amt, isKip, txnType === 'in' ? -1 : 1); // check before
  txns.push({ id: Date.now(), goalId: g.id, type: txnType, cur: txnCur, amount: amt, note, date: new Date().toISOString() });
  persist(); closeSheet('shTxn'); render();

  if (txnType === 'in' && isGoalDone(g) && wasNotDone) {
    setTimeout(() => { celebrate(); showToast('🎉 ຄົບເປົ້າໝາຍແລ້ວ! ຍິນດີດ້ວຍ!'); }, 200);
  } else {
    showToast(txnType === 'in' ? '✅ ຝາກສຳເລັດ!' : '✅ ຖອນສຳເລັດ!');
  }
}

// goal is done when BOTH kip & baht reach target (if target set)
function isGoalDone(g) {
  const kipOk  = !g.targetKip  || g.savedKip  >= g.targetKip;
  const bahtOk = !g.targetBaht || g.savedBaht >= g.targetBaht;
  return kipOk && bahtOk;
}

// ============================================================
// DELETE
// ============================================================
function openDelete(idx) {
  delIdx = idx;
  const g = goals[idx];
  document.getElementById('delIcon').textContent = g.emoji;
  document.getElementById('delName').textContent = g.name;
  let s = '';
  if (g.savedKip)  s += `₭${g.savedKip.toLocaleString('en')} `;
  if (g.savedBaht) s += `฿${g.savedBaht.toLocaleString('en')}`;
  document.getElementById('delSaved').textContent = s ? 'ເກັບໄດ້: '+s.trim() : 'ຍັງບໍ່ໄດ້ເກັບ';
  openSheet('shDel');
}
function confirmDelete() {
  const g = goals[delIdx];
  txns = txns.filter(t => t.goalId !== g.id);
  goals.splice(delIdx, 1);
  persist(); closeSheet('shDel'); render();
  showToast('🗑️ ລຶບສຳເລັດ');
}

// ============================================================
// RENDER
// ============================================================
function render() { renderSummary(); renderGoals(); }

function renderSummary() {
  const totalKip  = goals.reduce((s,g) => s+g.savedKip, 0);
  const totalBaht = goals.reduce((s,g) => s+g.savedBaht, 0);
  const done = goals.filter(g => isGoalDone(g)).length;
  document.getElementById('sumKip').textContent  = totalKip.toLocaleString('en');
  document.getElementById('sumBaht').textContent = totalBaht.toLocaleString('en');
  document.getElementById('statGoals').textContent = goals.length;
  document.getElementById('statDone').textContent  = done;
}

function renderGoals() {
  const el = document.getElementById('goalList');
  if (!goals.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="empty-pig">🐷</div>
        <div class="empty-title">ຍັງບໍ່ມີເປົ້າໝາຍ</div>
        <div class="empty-sub">ກົດ <b style="color:var(--orange)">+</b> ເພື່ອຕັ້ງເປົ້າໝາຍໃໝ່<br>ເກັບໄດ້ທັງ ₭ ກີບ ແລະ ฿ ບາດ ໃນກ້ອງດຽວ!</div>
      </div>`;
    return;
  }

  el.innerHTML = goals.map((g, i) => {
    const done = isGoalDone(g);

    // Progress for KIP part
    const kipPct  = g.targetKip  ? Math.min(100, Math.round(g.savedKip  / g.targetKip  * 100)) : (g.savedKip  ? 100 : 0);
    const bahtPct = g.targetBaht ? Math.min(100, Math.round(g.savedBaht / g.targetBaht * 100)) : (g.savedBaht ? 100 : 0);

    // Combined pct: average of active targets
    let activeParts = 0, totalPct = 0;
    if (g.targetKip)  { activeParts++; totalPct += kipPct; }
    if (g.targetBaht) { activeParts++; totalPct += bahtPct; }
    const combinedPct = activeParts ? Math.round(totalPct / activeParts) : 0;

    // Date info
    let dateInfo = '';
    if (g.date) {
      const diff = Math.ceil((new Date(g.date) - new Date()) / 86400000);
      dateInfo = diff > 0 ? ` • ເຫຼືອ ${diff} ວັນ` : diff === 0 ? ' • ມື້ນີ້!' : ' • ເກີນກຳນົດ';
    }

    // Remain texts
    const kipRemain  = g.targetKip  ? Math.max(0, g.targetKip  - g.savedKip)  : 0;
    const bahtRemain = g.targetBaht ? Math.max(0, g.targetBaht - g.savedBaht) : 0;
    let remainStr = '';
    if (!done) {
      const parts = [];
      if (kipRemain > 0)  parts.push(`₭${kipRemain.toLocaleString('en')}`);
      if (bahtRemain > 0) parts.push(`฿${bahtRemain.toLocaleString('en')}`);
      if (parts.length) remainStr = 'ຂາດ ' + parts.join(' + ');
    }

    return `
    <div class="goal-card ${done?'done':''}" style="animation-delay:${i*.06}s">
      <div class="goal-top">
        <div class="goal-icon">${g.emoji}</div>
        <div class="goal-meta">
          <div class="goal-name">${g.name}</div>
          <div class="goal-sub">
            ${g.targetKip  ? `₭${g.targetKip.toLocaleString('en')}` : ''}
            ${g.targetKip && g.targetBaht ? ' + ' : ''}
            ${g.targetBaht ? `฿${g.targetBaht.toLocaleString('en')}` : ''}
            ${dateInfo}
          </div>
        </div>
        ${done ? `<div class="done-badge">🎉 ຄົບ!</div>` : ''}
      </div>

      <!-- DUAL SAVED BLOCKS -->
      <div class="dual-saved">
        ${g.targetKip || g.savedKip ? `
        <div class="cur-saved-block kip">
          <div class="csb-label">ກີບ ₭</div>
          <div class="csb-saved">₭${g.savedKip.toLocaleString('en')}</div>
          ${g.targetKip ? `<div class="csb-target">/ ₭${g.targetKip.toLocaleString('en')} (${kipPct}%)</div>` : ''}
        </div>` : ''}
        ${g.targetBaht || g.savedBaht ? `
        <div class="cur-saved-block baht">
          <div class="csb-label">ບາດ ฿</div>
          <div class="csb-saved">฿${g.savedBaht.toLocaleString('en')}</div>
          ${g.targetBaht ? `<div class="csb-target">/ ฿${g.targetBaht.toLocaleString('en')} (${bahtPct}%)</div>` : ''}
        </div>` : ''}
      </div>

      <!-- COMBINED PROGRESS BAR -->
      <div class="progress-section">
        <div class="progress-header">
          <span class="progress-label">${done ? '🎊 ສຳເລັດແລ້ວ!' : remainStr || 'ຄືບໜ້າ'}</span>
          <span class="progress-pct">${combinedPct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${combinedPct}%"></div>
        </div>
      </div>

      <!-- ACTION BTNS -->
      <div class="goal-actions">
        <button class="action-btn btn-kip" onclick="openTxn(${i},'in');setTxnCur('KIP')">+ ₭ ຝາກກີບ</button>
        <button class="action-btn btn-baht" onclick="openTxn(${i},'in');setTxnCur('THB')">+ ฿ ຝາກບາດ</button>
        <button class="action-btn btn-del" onclick="openDelete(${i})">🗑</button>
      </div>
      <div class="goal-actions" style="margin-top:6px">
        <button class="action-btn btn-withdraw" style="flex:1" onclick="openTxn(${i},'out')">− ຖອນເງິນ</button>
      </div>
    </div>`;
  }).join('');
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!txns.length) {
    el.innerHTML = `<div class="empty"><div class="empty-pig">📭</div><div class="empty-title">ຍັງບໍ່ມີລາຍການ</div></div>`;
    return;
  }
  el.innerHTML = [...txns].reverse().map(t => {
    const g = goals.find(x => x.id === t.goalId);
    const isIn  = t.type === 'in';
    const isKip = t.cur  === 'KIP';
    const sym   = isKip ? '₭' : '฿';
    const cls   = (isKip ? 'kip' : 'baht') + (isIn ? '-in' : '-out');
    const ico   = isIn ? (isKip ? '₭' : '฿') : '💸';
    const d = new Date(t.date);
    const ds = d.toLocaleDateString('lo-LA',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('lo-LA',{hour:'2-digit',minute:'2-digit'});
    return `
    <div class="history-item">
      <div class="hist-icon ${cls}" style="font-size:16px;font-weight:700;font-family:'Kanit',sans-serif;">${ico}</div>
      <div class="hist-info">
        <div class="hist-name">${g?g.emoji+' '+g.name:'ລຶບແລ້ວ'}${t.note?' • '+t.note:''}</div>
        <div class="hist-sub">${ds} • ${isKip?'ກີບ':'ບາດ'}</div>
      </div>
      <div class="hist-amt ${cls}">${isIn?'+':'-'}${sym}${t.amount.toLocaleString('en')}</div>
    </div>`;
  }).join('');
}

// ============================================================
// CELEBRATE
// ============================================================
function celebrate() {
  const wrap = document.getElementById('confettiWrap');
  const colors = ['#f4845f','#f7c948','#2d9c8e','#e74c3c','#27ae60','#1a6fb5'];
  for (let i=0;i<70;i++) {
    const c = document.createElement('div');
    c.className = 'conf';
    c.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${.8+Math.random()*1.3}s;animation-delay:${Math.random()*.6}s;width:${5+Math.random()*9}px;height:${5+Math.random()*9}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    wrap.appendChild(c);
    setTimeout(()=>c.remove(), 2800);
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

// ============================================================
// INIT
// ============================================================
render();
</script>

</body>
</html>
