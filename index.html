<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ກະປຸກ.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Kanit:wght@300;600;700&display=swap');

/* ============================================================
   THEME VARIABLES — overridden by JS for dark mode + hue
   ============================================================ */
:root {
  --hue: 28;           /* bg hue, adjustable */
  --sat: 85%;
  --lit: 95%;

  --bg:      hsl(var(--hue), 50%, 96%);
  --bg2:     hsl(var(--hue), 40%, 92%);
  --card:    hsl(var(--hue), 30%, 99%);
  --border:  hsl(var(--hue), 30%, 88%);

  --accent:  #f4845f;
  --accent2: #e05c35;
  --teal:    #2d9c8e;
  --teal-lt: hsl(174,50%,93%);
  --yellow:  #f7c948;

  --kip:     #e07b39;
  --kip-bg:  hsl(25,90%,95%);
  --baht:    #1a6fb5;
  --baht-bg: hsl(210,70%,94%);

  --text:    hsl(var(--hue), 40%, 12%);
  --text2:   hsl(var(--hue), 20%, 45%);
  --text3:   hsl(var(--hue), 15%, 68%);

  --red:     #e74c3c;
  --green:   #27ae60;

  --shadow:  0 2px 16px rgba(0,0,0,0.07);
  --r:       20px;
  --rs:      12px;
}

/* DARK MODE */
body.dark {
  --bg:   #111318;
  --bg2:  #1a1d24;
  --card: #20242e;
  --border: #2e3340;
  --text:  #f0ece4;
  --text2: #9a9080;
  --text3: #5a5450;
  --kip-bg:  rgba(224,123,57,.12);
  --baht-bg: rgba(26,111,181,.12);
  --teal-lt: rgba(45,156,142,.15);
  --shadow:  0 2px 16px rgba(0,0,0,0.35);
}

* { margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent; }
html,body { height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Mitr',sans-serif;transition:background .3s,color .3s; }

.app { display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg);position:relative;transition:background .3s; }

/* ===== HEADER ===== */
.header { padding:52px 18px 0;flex-shrink:0; }
.header-row { display:flex;align-items:center;justify-content:space-between;margin-bottom:16px; }
.app-title { font-family:'Kanit',sans-serif;font-size:26px;font-weight:700;color:var(--text); }
.app-title span { color:var(--accent); }
.header-actions { display:flex;gap:8px;align-items:center; }
.icon-btn {
  width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text2);font-size:17px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.icon-btn:active { transform:scale(.92); }

/* SUMMARY CARD */
.summary-card {
  background:var(--accent);border-radius:var(--r);
  padding:18px 20px;margin-bottom:6px;position:relative;overflow:hidden;
  transition:background .3s;
}
.summary-card::after { content:'🐖';position:absolute;right:-6px;bottom:-10px;font-size:78px;opacity:.13;transform:scaleX(-1);pointer-events:none; }
.summary-label { font-size:11px;color:rgba(255,255,255,.72);letter-spacing:.5px;margin-bottom:10px; }
.summary-row { display:flex;gap:20px;align-items:flex-end;margin-bottom:12px; }
.summary-cur { font-size:11px;color:rgba(255,255,255,.65);margin-bottom:1px; }
.summary-amt { font-family:'Kanit',sans-serif;font-size:26px;font-weight:700;color:#fff;line-height:1; }
.summary-divider { width:1px;background:rgba(255,255,255,.25);align-self:stretch;margin-bottom:2px; }
.summary-stats { display:flex;gap:10px; }
.stat-pill { background:rgba(255,255,255,.18);border-radius:20px;padding:4px 11px;font-size:12px;color:#fff; }

/* ===== SCROLL ===== */
.scroll-area { flex:1;overflow-y:auto;padding:12px 16px 110px;-webkit-overflow-scrolling:touch; }
.scroll-area::-webkit-scrollbar { display:none; }
.sec-label { font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin:14px 4px 10px; }

/* ===== GOAL CARD ===== */
.goal-card {
  background:var(--card);border-radius:var(--r);
  padding:16px 16px 13px;margin-bottom:12px;
  box-shadow:var(--shadow);
  border:1.5px solid var(--border);
  position:relative;overflow:hidden;
  animation:slideUp .35s ease both;
  transition:border-color .3s,background .3s;
}
.goal-card.done { border-color:var(--teal); }
.goal-card::before {
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:4px;background:var(--accent);border-radius:4px 0 0 4px;transition:background .3s;
}
.goal-card.done::before { background:var(--teal); }
@keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.goal-top { display:flex;align-items:flex-start;gap:12px;margin-bottom:12px; }
.goal-icon { width:44px;height:44px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;transition:background .3s; }
.goal-card.done .goal-icon { background:var(--teal-lt); }
.goal-meta { flex:1;min-width:0; }
.goal-name { font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;color:var(--text); }
.goal-sub { font-size:12px;color:var(--text2); }
.done-badge { background:var(--teal-lt);color:var(--teal);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;flex-shrink:0; }

/* DUAL SAVED */
.dual-saved { display:flex;gap:8px;margin-bottom:10px; }
.csb { flex:1;border-radius:var(--rs);padding:9px 11px;transition:background .3s; }
.csb.kip { background:var(--kip-bg); }
.csb.baht { background:var(--baht-bg); }
.csb-lbl { font-size:10px;font-weight:600;letter-spacing:.5px;margin-bottom:2px; }
.csb.kip .csb-lbl { color:var(--kip); }
.csb.baht .csb-lbl { color:var(--baht); }
.csb-amt { font-family:'Kanit',sans-serif;font-size:17px;font-weight:700;line-height:1; }
.csb.kip .csb-amt { color:var(--kip); }
.csb.baht .csb-amt { color:var(--baht); }
.csb-tgt { font-size:11px;color:var(--text3);margin-top:1px; }

/* PROGRESS */
.progress-section { margin-bottom:11px; }
.progress-head { display:flex;justify-content:space-between;align-items:center;margin-bottom:5px; }
.progress-label { font-size:12px;color:var(--text2); }
.progress-pct { font-size:13px;font-weight:700; }
.progress-track { height:10px;background:var(--bg2);border-radius:10px;overflow:hidden; }
.progress-fill { height:100%;border-radius:10px;transition:width .7s cubic-bezier(.34,1.4,.64,1),background .5s; }
/* done state */
.goal-card.done .progress-fill { background:linear-gradient(90deg,var(--teal),#5ec2b7) !important; }

/* ACTION BTNS */
.goal-actions { display:flex;gap:7px;margin-top:2px; }
.action-btn {
  flex:1;padding:9px 0;border-radius:var(--rs);border:none;
  font-family:'Mitr',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .18s;
}
.action-btn:active { transform:scale(.94); }
.btn-kip { background:var(--kip-bg);color:var(--kip); }
.btn-baht { background:var(--baht-bg);color:var(--baht); }
.btn-wd { background:var(--bg2);color:var(--text2);border:1.5px solid var(--border); }
.btn-edit { flex:0;width:36px;background:var(--bg2);color:var(--text2);border:1.5px solid var(--border); }
.btn-del { flex:0;width:36px;background:rgba(231,76,60,.1);color:var(--red);border:1.5px solid rgba(231,76,60,.18); }

/* EMPTY */
.empty { text-align:center;padding:50px 20px; }
.empty-pig { font-size:60px;margin-bottom:14px;animation:bounce 2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.empty-title { font-family:'Kanit',sans-serif;font-size:20px;font-weight:600;margin-bottom:6px;color:var(--text); }
.empty-sub { font-size:14px;color:var(--text2);line-height:1.7; }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position:absolute;bottom:0;left:0;right:0;
  background:var(--card);backdrop-filter:blur(14px);
  border-top:1.5px solid var(--border);
  display:flex;padding:10px 0 28px;z-index:50;
  transition:background .3s,border-color .3s;
}
.nav-item { flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 0;color:var(--text3);font-size:10px;transition:color .2s; }
.nav-item.active { color:var(--accent); }
.nav-icon { font-size:21px; }
.nav-fab {
  width:52px;height:52px;border-radius:16px;
  background:var(--accent);color:#fff;border:none;font-size:28px;
  cursor:pointer;box-shadow:0 6px 20px rgba(244,132,95,.4);
  display:flex;align-items:center;justify-content:center;
  margin-top:-18px;transition:transform .2s;
}
.nav-fab:active { transform:scale(.92); }

/* ===== OVERLAY + SHEET ===== */
.overlay { position:fixed;inset:0;background:rgba(0,0,0,.44);backdrop-filter:blur(4px);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s; }
.overlay.open { opacity:1;pointer-events:all; }
.sheet {
  position:fixed;bottom:0;left:50%;transform:translate(-50%,110%);
  width:100%;max-width:430px;
  background:var(--card);border-radius:28px 28px 0 0;
  padding:16px 20px 48px;z-index:300;
  transition:transform .38s cubic-bezier(.32,1.1,.64,1),background .3s;
  max-height:92vh;overflow-y:auto;
}
.sheet.open { transform:translate(-50%,0); }
.sheet-handle { width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 20px; }
.sheet-title { font-family:'Kanit',sans-serif;font-size:22px;font-weight:700;margin-bottom:20px;color:var(--text); }

/* FORM */
.form-group { margin-bottom:15px; }
.form-label { font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.4px;margin-bottom:7px;display:block; }
.form-input {
  width:100%;padding:12px 14px;border-radius:var(--rs);
  border:1.5px solid var(--border);background:var(--bg);
  font-family:'Mitr',sans-serif;font-size:15px;color:var(--text);
  outline:none;transition:border-color .2s,background .3s;-webkit-appearance:none;
}
.form-input:focus { border-color:var(--accent); }
.form-input::placeholder { color:var(--text3); }
.input-kip { border-color:rgba(224,123,57,.35)!important;background:var(--kip-bg)!important; }
.input-kip:focus { border-color:var(--kip)!important; }
.input-baht { border-color:rgba(26,111,181,.3)!important;background:var(--baht-bg)!important; }
.input-baht:focus { border-color:var(--baht)!important; }
.input-kip::placeholder { color:rgba(224,123,57,.6); }
.input-baht::placeholder { color:rgba(26,111,181,.5); }
.dual-input-row { display:flex;gap:10px; }
.dual-input-row .form-group { flex:1;margin-bottom:0; }
.cur-kip { color:var(--kip)!important; }
.cur-baht { color:var(--baht)!important; }

/* EMOJI */
.emoji-row { display:grid;grid-template-columns:repeat(6,1fr);gap:7px; }
.emoji-chip { aspect-ratio:1;border-radius:11px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer;border:2.5px solid transparent;transition:all .15s; }
.emoji-chip:active { transform:scale(.86); }
.emoji-chip.sel { border-color:var(--accent);background:rgba(244,132,95,.1); }

/* QUICK */
.quick-row { display:flex;gap:6px;margin-top:8px;flex-wrap:wrap; }
.quick-chip { padding:5px 10px;border-radius:18px;border:1.5px solid var(--border);background:var(--bg);font-family:'Mitr',sans-serif;font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s; }
.quick-chip.kip { border-color:rgba(224,123,57,.35);color:var(--kip);background:var(--kip-bg); }
.quick-chip.baht { border-color:rgba(26,111,181,.3);color:var(--baht);background:var(--baht-bg); }
.quick-chip:active { opacity:.7; }

/* GOAL PREVIEW */
.goal-preview { display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--rs);padding:12px 14px;margin-bottom:16px;transition:background .3s; }
.gp-name { font-size:14px;font-weight:600;color:var(--text); }
.gp-sub { font-size:12px;color:var(--text2);margin-top:2px; }

/* TXN CUR TOGGLE */
.tcur-row { display:flex;gap:8px;margin-bottom:15px; }
.tcur-btn { flex:1;padding:10px;border-radius:var(--rs);border:1.5px solid;font-family:'Mitr',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;background:transparent; }
.tcur-btn.kip { border-color:rgba(224,123,57,.4);color:var(--kip); }
.tcur-btn.kip.sel { background:var(--kip);color:#fff;border-color:var(--kip); }
.tcur-btn.baht { border-color:rgba(26,111,181,.35);color:var(--baht); }
.tcur-btn.baht.sel { background:var(--baht);color:#fff;border-color:var(--baht); }

/* BUTTONS */
.btn-primary { width:100%;padding:14px;border-radius:var(--rs);border:none;background:var(--accent);color:#fff;font-family:'Mitr',sans-serif;font-size:16px;font-weight:500;cursor:pointer;margin-top:10px;box-shadow:0 4px 14px rgba(244,132,95,.3);transition:all .2s; }
.btn-primary:active { transform:scale(.97);background:var(--accent2); }
.btn-secondary { width:100%;padding:12px;border-radius:var(--rs);border:1.5px solid var(--border);background:transparent;font-family:'Mitr',sans-serif;font-size:14px;color:var(--text2);cursor:pointer;margin-top:8px; }
.btn-danger { width:100%;padding:12px;border-radius:var(--rs);border:none;background:rgba(231,76,60,.1);color:var(--red);font-family:'Mitr',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px; }

/* ===== SETTINGS SHEET ===== */
.setting-row { display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border); }
.setting-row:last-child { border-bottom:none; }
.setting-label { font-size:14px;font-weight:500;color:var(--text); }
.setting-sub { font-size:12px;color:var(--text3);margin-top:2px; }

/* TOGGLE SWITCH */
.toggle { position:relative;width:46px;height:26px;flex-shrink:0; }
.toggle input { opacity:0;width:0;height:0; }
.toggle-slider { position:absolute;inset:0;background:var(--border);border-radius:26px;cursor:pointer;transition:background .3s; }
.toggle-slider::before { content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .3s;box-shadow:0 1px 4px rgba(0,0,0,.2); }
.toggle input:checked + .toggle-slider { background:var(--accent); }
.toggle input:checked + .toggle-slider::before { transform:translateX(20px); }

/* COLOR SLIDERS */
.color-preview { width:100%;height:32px;border-radius:10px;margin-bottom:10px;border:1.5px solid var(--border); }
.slider-row { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
.slider-row label { font-size:12px;color:var(--text3);width:28px;flex-shrink:0; }
input[type=range].hue-slider {
  flex:1;height:8px;border-radius:8px;outline:none;-webkit-appearance:none;
  background:linear-gradient(90deg,hsl(0,80%,75%),hsl(30,80%,75%),hsl(60,80%,75%),hsl(120,80%,75%),hsl(180,80%,75%),hsl(240,80%,75%),hsl(300,80%,75%),hsl(360,80%,75%));
  cursor:pointer;
}
input[type=range].sat-slider {
  flex:1;height:8px;border-radius:8px;outline:none;-webkit-appearance:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);cursor:pointer;border:1.5px solid rgba(0,0,0,.1); }

/* PRESET COLORS */
.color-presets { display:flex;gap:8px;flex-wrap:wrap;margin-top:4px; }
.color-preset { width:32px;height:32px;border-radius:10px;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s; }
.color-preset:active { transform:scale(.88); }
.color-preset.sel { border-color:var(--text); }

/* HISTORY */
.history-item { display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--card);border-radius:var(--rs);margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--border);transition:background .3s; }
.hist-icon { width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:'Kanit',sans-serif;flex-shrink:0; }
.hist-icon.ki { background:var(--kip-bg);color:var(--kip); }
.hist-icon.bi { background:var(--baht-bg);color:var(--baht); }
.hist-icon.out { background:rgba(231,76,60,.1);color:var(--red); }
.hist-info { flex:1;min-width:0; }
.hist-name { font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text); }
.hist-sub { font-size:11px;color:var(--text3);margin-top:1px; }
.hist-amt { font-family:'Kanit',sans-serif;font-size:15px;font-weight:600;flex-shrink:0; }

/* CONFETTI */
.cw { position:fixed;inset:0;pointer-events:none;z-index:999; }
.cf { position:absolute;animation:fall linear forwards; }
@keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

/* TOAST */
.toast { position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none; }
.toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

.page { display:none; }
.page.active { display:block; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div class="app-title">ກະປຸກ<span>.</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="darkBtn" onclick="toggleDark()" title="Dark mode">🌙</button>
        <button class="icon-btn" onclick="openSheet('shSettings')" title="ຕັ້ງຄ່າ">🎨</button>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-label">ຍອດລວມທີ່ເກັບໄດ້ • ₭ + ฿</div>
      <div class="summary-row">
        <div>
          <div class="summary-cur">ກີບ ₭</div>
          <div class="summary-amt" id="sumKip">0</div>
        </div>
        <div class="summary-divider"></div>
        <div>
          <div class="summary-cur">ບາດ ฿</div>
          <div class="summary-amt" id="sumBaht">0</div>
        </div>
      </div>
      <div class="summary-stats">
        <div class="stat-pill">🎯 <span id="statGoals">0</span> ເປົ້າ</div>
        <div class="stat-pill">✅ <span id="statDone">0</span> ສຳເລັດ</div>
      </div>
    </div>
  </div>

  <!-- PAGES -->
  <div class="scroll-area" id="scrollArea">
    <div class="page active" id="pageHome">
      <div class="sec-label">ເປົ້າໝາຍຂອງຂ້ອຍ</div>
      <div id="goalList"></div>
    </div>
    <div class="page" id="pageHistory">
      <div class="sec-label">ປະຫວັດການເກັບ</div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active" id="navHome" onclick="showPage('Home')">
      <div class="nav-icon">🏠</div><span>ໜ້າຫຼັກ</span>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center">
      <button class="nav-fab" id="fabBtn">+</button>
    </div>
    <div class="nav-item" id="navHistory" onclick="showPage('History')">
      <div class="nav-icon">📋</div><span>ປະຫວັດ</span>
    </div>
  </div>
</div>

<!-- ===== SHEET: NEW/EDIT GOAL ===== -->
<div class="overlay" id="ovGoal" onclick="closeSheet('shGoal')"></div>
<div class="sheet" id="shGoal">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="goalSheetTitle">✨ ຕັ້ງເປົ້າໝາຍໃໝ່</div>

  <div class="form-group">
    <label class="form-label">ຢາກໄດ້ຫຍັງ?</label>
    <input type="text" class="form-input" id="gName" placeholder="ເຊັ່ນ: iPhone 16, ກະເປົ໋າ, ທ່ຽວ…"/>
  </div>
  <div class="form-group">
    <label class="form-label">ເລືອກໄອຄອນ</label>
    <div class="emoji-row" id="emojiRow"></div>
  </div>
  <div class="form-group">

<script>
// ============================================================
//  DATA
// ============================================================
const EMOJIS=['📱','💻','👜','👟','✈️','🏠','🚗','💎','🎮','📷','⌚','🎸','🏋️','🎓','🌴','💍','🎁','🛒','☕','🍜','🧳','🎯','🏖️','🎪'];
const QK=[10000,50000,100000,500000,1000000];
const QB=[20,50,100,500,1000];

// COLOR PRESETS: [hue, sat, lit]
const PRESETS=[
  {h:28,s:50,l:96,d:18, label:'🍊'},
  {h:340,s:55,l:96,d:18, label:'🌸'},
  {h:200,s:55,l:95,d:18, label:'🩵'},
  {h:130,s:45,l:95,d:18, label:'🌿'},
  {h:260,s:45,l:96,d:18, label:'💜'},
  {h:45,s:70,l:96,d:18,  label:'🌻'},
  {h:0,s:0,l:96,d:15,    label:'🤍'},
];

let goals = JSON.parse(localStorage.getItem('gk4_goals')||'[]');
let txns  = JSON.parse(localStorage.getItem('gk4_txns') ||'[]');
let settings = JSON.parse(localStorage.getItem('gk4_settings')||'{"dark":false,"hue":28,"sat":50,"lit":96}');

let selEmoji=EMOJIS[0], editIdx=null, txnGoalIdx=null, txnType=null, txnCur='KIP', delIdx=null;

function persist(){
  localStorage.setItem('gk4_goals',JSON.stringify(goals));
  localStorage.setItem('gk4_txns', JSON.stringify(txns));
  localStorage.setItem('gk4_settings',JSON.stringify(settings));
}

// ============================================================
//  THEME
// ============================================================
function applyTheme(){
  const r=document.documentElement;
  const dark=settings.dark;
  document.body.classList.toggle('dark',dark);
  document.getElementById('darkBtn').textContent=dark?'☀️':'🌙';
  document.getElementById('darkToggle').checked=dark;

  // bg color vars (only used in light mode meaningfully)
  r.style.setProperty('--hue', settings.hue);
  r.style.setProperty('--sat', settings.sat+'%');
  r.style.setProperty('--lit', settings.lit+'%');

  if(!dark){
    r.style.setProperty('--bg',   `hsl(${settings.hue},${settings.sat}%,${settings.lit}%)`);
    r.style.setProperty('--bg2',  `hsl(${settings.hue},${Math.max(settings.sat-10,0)}%,${Math.max(settings.lit-4,80)}%)`);
    r.style.setProperty('--border',`hsl(${settings.hue},${Math.max(settings.sat-20,0)}%,${Math.max(settings.lit-8,70)}%)`);
    r.style.setProperty('--card', `hsl(${settings.hue},${Math.max(settings.sat-25,0)}%,${Math.min(settings.lit+2,100)}%)`);
  }
  updateColorPreview();
  updateSatSliderBg();
}

function toggleDark(){
  settings.dark=!settings.dark;
  persist(); applyTheme();
}

function applyBgColor(){
  settings.hue=+document.getElementById('hueSlider').value;
  settings.sat=+document.getElementById('satSlider').value;
  settings.lit=+document.getElementById('litSlider').value;
  persist(); applyTheme();
}

function updateColorPreview(){
  const p=document.getElementById('colorPreview');
  const {hue:h,sat:s,lit:l}=settings;
  p.style.background=settings.dark
    ? `linear-gradient(135deg,hsl(${h},${s}%,14%),hsl(${h},${s}%,22%))`
    : `linear-gradient(135deg,hsl(${h},${s}%,${l}%),hsl(${h},${s}%,${Math.max(l-8,70)}%))`;
}

function updateSatSliderBg(){
  const h=settings.hue, l=settings.lit;
  document.getElementById('satSlider').style.background=
    `linear-gradient(90deg,hsl(${h},0%,${l}%),hsl(${h},100%,${l}%))`;
}

function renderColorPresets(){
  document.getElementById('colorPresets').innerHTML=PRESETS.map((p,i)=>`
    <div class="color-preset" title="${p.label}"
      style="background:hsl(${p.h},${p.s}%,${p.l}%);${isPresetSel(p)?'border-color:var(--text)':''}"
      onclick="applyPreset(${i})">${p.label}</div>
  `).join('');
}
function isPresetSel(p){ return Math.abs(settings.hue-p.h)<5&&Math.abs(settings.sat-p.s)<10; }
function applyPreset(i){
  const p=PRESETS[i];
  settings.hue=p.h; settings.sat=p.s; settings.lit=p.l;
  document.getElementById('hueSlider').value=p.h;
  document.getElementById('satSlider').value=p.s;
  document.getElementById('litSlider').value=p.l;
  persist(); applyTheme(); renderColorPresets();
}

// ============================================================
//  PROGRESS COLOR — gradient by percent
//  0-30%  red→orange
//  30-60% orange→yellow
//  60-90% yellow→lime
//  90-100% lime→green
// ============================================================
function progressColor(pct){
  if(pct>=100) return 'linear-gradient(90deg,#2d9c8e,#5ec2b7)';
  // lerp between stops
  const stops=[
    {p:0,   c:[231,76,60]},
    {p:30,  c:[244,132,95]},
    {p:55,  c:[247,201,72]},
    {p:80,  c:[150,210,60]},
    {p:100, c:[39,174,96]},
  ];
  function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
  function stopColor(pct){
    for(let i=0;i<stops.length-1;i++){
      if(pct<=stops[i+1].p){
        const t=(pct-stops[i].p)/(stops[i+1].p-stops[i].p);
        const r=lerp(stops[i].c[0],stops[i+1].c[0],t);
        const g=lerp(stops[i].c[1],stops[i+1].c[1],t);
        const b=lerp(stops[i].c[2],stops[i+1].c[2],t);
        return `rgb(${r},${g},${b})`;
      }
    }
    return `rgb(${stops[stops.length-1].c.join(',')})`;
  }
  const c1=stopColor(Math.max(0,pct-15));
  const c2=stopColor(pct);
  return `linear-gradient(90deg,${c1},${c2})`;
}
function progressTextColor(pct){
  if(pct<35) return '#e74c3c';
  if(pct<60) return '#e07b39';
  if(pct<80) return '#c5a800';
  return '#27ae60';
}

// ============================================================
//  PAGES / SHEETS
// ============================================================
function showPage(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('page'+n).classList.add('active');
  document.getElementById('nav'+n).classList.add('active');
  if(n==='History') renderHistory();
  document.getElementById('scrollArea').scrollTop=0;
}
function openSheet(id){
  const ov=id.replace('sh','ov');
  document.getElementById(ov).classList.add('open');
  document.getElementById(id).classList.add('open');
}
function closeSheet(id){
  const ov=id.replace('sh','ov');
  document.getElementById(ov).classList.remove('open');
  document.getElementById(id).classList.remove('open');
}

// ============================================================
//  EMOJI
// ============================================================
function renderEmojiRow(){
  document.getElementById('emojiRow').innerHTML=EMOJIS.map(e=>
    `<div class="emoji-chip ${e===selEmoji?'sel':''}" onclick="pickEmoji('${e}')">${e}</div>`
  ).join('');
}
function pickEmoji(e){
  selEmoji=e;
  document.querySelectorAll('.emoji-chip').forEach(c=>c.classList.toggle('sel',c.textContent===e));
}

// ============================================================
//  QUICK AMOUNTS
// ============================================================
function renderQGoal(){
  document.getElementById('qKipGoal').innerHTML=QK.map(a=>
    `<div class="quick-chip kip" onclick="document.getElementById('gTargetKip').value=${a}">₭${a.toLocaleString('en')}</div>`
  ).join('');
  document.getElementById('qBahtGoal').innerHTML=QB.map(a=>
    `<div class="quick-chip baht" onclick="document.getElementById('gTargetBaht').value=${a}">฿${a.toLocaleString('en')}</div>`
  ).join('');
}
function renderQTxn(){
  const list=txnCur==='KIP'?QK:QB, sym=txnCur==='KIP'?'₭':'฿', cls=txnCur==='KIP'?'kip':'baht';
  document.getElementById('txnQuick').innerHTML=list.map(a=>
    `<div class="quick-chip ${cls}" onclick="document.getElementById('txnAmt').value=${a}">${sym}${a.toLocaleString('en')}</div>`
  ).join('');
}

// ============================================================
//  GOAL CRUD
// ============================================================
function openNewGoal(){
  editIdx=null;
  document.getElementById('goalSheetTitle').textContent='✨ ຕັ້ງເປົ້າໝາຍໃໝ່';
  document.getElementById('goalSaveBtn').textContent='💾 ບັນທຶກ';
  document.getElementById('gName').value='';
  document.getElementById('gTargetKip').value='';
  document.getElementById('gTargetBaht').value='';
  document.getElementById('gDate').value='';
  selEmoji=EMOJIS[0];
  renderEmojiRow(); renderQGoal();
  openSheet('shGoal');
}
document.getElementById('fabBtn').onclick=openNewGoal;

function openEditGoal(idx){
  editIdx=idx;
  const g=goals[idx];
  document.getElementById('goalSheetTitle').textContent='✏️ ແກ້ໄຂເປົ້າໝາຍ';
  document.getElementById('goalSaveBtn').textContent='💾 ອັບເດດ';
  document.getElementById('gName').value=g.name;
  document.getElementById('gTargetKip').value=g.targetKip||'';
  document.getElementById('gTargetBaht').value=g.targetBaht||'';
  document.getElementById('gDate').value=g.date||'';
  selEmoji=g.emoji;
  renderEmojiRow(); renderQGoal();
  openSheet('shGoal');
}

function saveGoal(){
  const name=document.getElementById('gName').value.trim();
  const tKip=parseFloat(document.getElementById('gTargetKip').value)||0;
  const tBaht=parseFloat(document.getElementById('gTargetBaht').value)||0;
  const date=document.getElementById('gDate').value;
  if(!name){showToast('ກະລຸນາໃສ່ຊື່ 😊');return;}
  if(!tKip&&!tBaht){showToast('ໃສ່ລາຄາຢ່າງໜ້ອຍ 1 ສະກຸນ');return;}

  if(editIdx!==null){
    // EDIT — keep savedKip/savedBaht
    Object.assign(goals[editIdx],{
      name, emoji:selEmoji,
      targetKip:Math.round(tKip), targetBaht:Math.round(tBaht), date
    });
    persist(); closeSheet('shGoal'); render();
    showToast('✅ ອັບເດດສຳເລັດ!');
  } else {
    goals.push({id:Date.now(),name,emoji:selEmoji,targetKip:Math.round(tKip),targetBaht:Math.round(tBaht),savedKip:0,savedBaht:0,date});
    persist(); closeSheet('shGoal'); render();
    showToast('✨ ສ້າງເປົ້າໝາຍສຳເລັດ!');
  }
}

// ============================================================
//  TXN
// ============================================================
function setTxnCur(c){
  txnCur=c;
  document.getElementById('tbKip').classList.toggle('sel',c==='KIP');
  document.getElementById('tbBaht').classList.toggle('sel',c==='THB');
  document.getElementById('txnAmtLbl').textContent=c==='KIP'?'ຈຳນວນ (ກີບ ₭)':'ຈຳນວນ (ບາດ ฿)';
  document.getElementById('txnAmt').value='';
  renderQTxn();
}
function openTxn(idx,type){
  txnGoalIdx=idx; txnType=type;
  const g=goals[idx];
  document.getElementById('txnTitle').textContent=type==='in'?'💰 ຝາກເງິນ':'💸 ຖອນເງິນ';
  document.getElementById('txnIcon').textContent=g.emoji;
  document.getElementById('txnGoalName').textContent=g.name;
  let info='';
  if(g.savedKip)  info+=`₭${g.savedKip.toLocaleString('en')} `;
  if(g.savedBaht) info+=`฿${g.savedBaht.toLocaleString('en')}`;
  document.getElementById('txnGoalInfo').textContent=info?'ເກັບໄດ້: '+info.trim():'ຍັງບໍ່ໄດ້ເກັບ';
  const btn=document.getElementById('txnBtn');
  btn.textContent=type==='in'?'💰 ຝາກ ✓':'💸 ຖອນ ✓';
  btn.style.background=type==='in'?'var(--accent)':'var(--red)';
  document.getElementById('txnAmt').value='';
  document.getElementById('txnNote').value='';
  txnCur='KIP';
  document.getElementById('tbKip').classList.add('sel');
  document.getElementById('tbBaht').classList.remove('sel');
  document.getElementById('txnAmtLbl').textContent='ຈຳນວນ (ກີບ ₭)';
  renderQTxn(); openSheet('shTxn');
}
function confirmTxn(){
  const raw=parseFloat(document.getElementById('txnAmt').value);
  const note=document.getElementById('txnNote').value.trim();
  if(!raw||raw<=0){showToast('ໃສ່ຈຳນວນເງິນ');return;}
  const amt=Math.round(raw);
  const g=goals[txnGoalIdx];
  const wasOk=isGoalDone(g);
  if(txnType==='in'){
    if(txnCur==='KIP') g.savedKip+=amt; else g.savedBaht+=amt;
  } else {
    if(txnCur==='KIP'){
      if(amt>g.savedKip){showToast('ກີບໃນກ້ອງບໍ່ພໍ! 🐷');return;} g.savedKip-=amt;
    } else {
      if(amt>g.savedBaht){showToast('ບາດໃນກ້ອງບໍ່ພໍ! 🐷');return;} g.savedBaht-=amt;
    }
  }
  txns.push({id:Date.now(),goalId:g.id,type:txnType,cur:txnCur,amount:amt,note,date:new Date().toISOString()});
  persist(); closeSheet('shTxn'); render();
  if(txnType==='in'&&!wasOk&&isGoalDone(g)){setTimeout(()=>{celebrate();showToast('🎉 ຄົບເປົ້າໝາຍ! ຍິນດີດ້ວຍ!');},250);}
  else showToast(txnType==='in'?'✅ ຝາກສຳເລັດ!':'✅ ຖອນສຳເລັດ!');
}
function isGoalDone(g){
  return(!g.targetKip||g.savedKip>=g.targetKip)&&(!g.targetBaht||g.savedBaht>=g.targetBaht);
}

// ============================================================
//  DELETE
// ============================================================
function openDelete(idx){
  delIdx=idx; const g=goals[idx];
  document.getElementById('delIcon').textContent=g.emoji;
  document.getElementById('delName').textContent=g.name;
  let s='';
  if(g.savedKip)  s+=`₭${g.savedKip.toLocaleString('en')} `;
  if(g.savedBaht) s+=`฿${g.savedBaht.toLocaleString('en')}`;
  document.getElementById('delSaved').textContent=s?'ເກັບ: '+s.trim():'ຍັງບໍ່ໄດ້ເກັບ';
  openSheet('shDel');
}
function confirmDelete(){
  const g=goals[delIdx];
  txns=txns.filter(t=>t.goalId!==g.id);
  goals.splice(delIdx,1);
  persist(); closeSheet('shDel'); render();
  showToast('🗑️ ລຶບສຳເລັດ');
}

// ============================================================
//  RENDER
// ============================================================
function render(){ renderSummary(); renderGoals(); }

function renderSummary(){
  const tKip=goals.reduce((s,g)=>s+g.savedKip,0);
  const tBaht=goals.reduce((s,g)=>s+g.savedBaht,0);
  const done=goals.filter(g=>isGoalDone(g)).length;
  document.getElementById('sumKip').textContent=tKip.toLocaleString('en');
  document.getElementById('sumBaht').textContent=tBaht.toLocaleString('en');
  document.getElementById('statGoals').textContent=goals.length;
  document.getElementById('statDone').textContent=done;
}

function renderGoals(){
  const el=document.getElementById('goalList');
  if(!goals.length){
    el.innerHTML=`<div class="empty">
      <div class="empty-pig">🐷</div>
      <div class="empty-title">ຍັງບໍ່ມີເປົ້າໝາຍ</div>
      <div class="empty-sub">ກົດ <b style="color:var(--accent)">+</b> ເພື່ອຕັ້ງເປົ້າໝາຍໃໝ່<br>ເກັບໄດ້ທັງ ₭ ກີບ ແລະ ฿ ບາດ ໃນກ້ອງດຽວ!</div>
    </div>`;
    return;
  }
  el.innerHTML=goals.map((g,i)=>{
    const done=isGoalDone(g);
    const kPct=g.targetKip  ?Math.min(100,Math.round(g.savedKip /g.targetKip *100)):(g.savedKip ?100:0);
    const bPct=g.targetBaht ?Math.min(100,Math.round(g.savedBaht/g.targetBaht*100)):(g.savedBaht?100:0);
    let parts=0,tot=0;
    if(g.targetKip){parts++;tot+=kPct;}
    if(g.targetBaht){parts++;tot+=bPct;}
    const cPct=parts?Math.round(tot/parts):0;

    const fillStyle=done
      ?'background:linear-gradient(90deg,var(--teal),#5ec2b7)'
      :`background:${progressColor(cPct)}`;
    const pctColor=done?'var(--teal)':progressTextColor(cPct);

    let dateInfo='';
    if(g.date){
      const diff=Math.ceil((new Date(g.date)-new Date())/86400000);
      dateInfo=diff>0?` • ເຫຼືອ${diff}ວັນ`:diff===0?' • ມື້ນີ້!'.' • ເກີນກຳນົດ';
    }
    const kRem=g.targetKip ?Math.max(0,g.targetKip -g.savedKip ):0;
    const bRem=g.targetBaht?Math.max(0,g.targetBaht-g.savedBaht):0;
    let remStr='';
    if(!done){
      const p=[];
      if(kRem>0)p.push(`₭${kRem.toLocaleString('en')}`);
      if(bRem>0)p.push(`฿${bRem.toLocaleString('en')}`);
      if(p.length)remStr='ຂາດ '+p.join(' + ');
    }

    return `
    <div class="goal-card ${done?'done':''}" style="animation-delay:${i*.06}s">
      <div class="goal-top">
        <div class="goal-icon">${g.emoji}</div>
        <div class="goal-meta">
          <div class="goal-name">${g.name}</div>
          <div class="goal-sub">
            ${g.targetKip?`₭${g.targetKip.toLocaleString('en')}`:''}
            ${g.targetKip&&g.targetBaht?' + ':''}
            ${g.targetBaht?`฿${g.targetBaht.toLocaleString('en')}`:''}
            ${dateInfo}
          </div>
        </div>
        ${done?`<div class="done-badge">🎉 ຄົບ!</div>`:''}
      </div>

      <div class="dual-saved">
        ${g.targetKip||g.savedKip?`
        <div class="csb kip">
          <div class="csb-lbl">ກີບ ₭</div>
          <div class="csb-amt">₭${g.savedKip.toLocaleString('en')}</div>
          ${g.targetKip?`<div class="csb-tgt">/ ₭${g.targetKip.toLocaleString('en')} (${kPct}%)</div>`:''}
        </div>`:''}
        ${g.targetBaht||g.savedBaht?`
        <div class="csb baht">
          <div class="csb-lbl">ບາດ ฿</div>
          <div class="csb-amt">฿${g.savedBaht.toLocaleString('en')}</div>
          ${g.targetBaht?`<div class="csb-tgt">/ ฿${g.targetBaht.toLocaleString('en')} (${bPct}%)</div>`:''}
        </div>`:''}
      </div>

      <div class="progress-section">
        <div class="progress-head">
          <span class="progress-label">${done?'🎊 ສຳເລັດ!':remStr||'ຄືບໜ້າ'}</span>
          <span class="progress-pct" style="color:${pctColor}">${cPct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${cPct}%;${fillStyle}"></div>
        </div>
      </div>

      <div class="goal-actions">
        <button class="action-btn btn-kip" onclick="openTxn(${i},'in');setTxnCur('KIP')">+ ₭</button>
        <button class="action-btn btn-baht" onclick="openTxn(${i},'in');setTxnCur('THB')">+ ฿</button>
        <button class="action-btn btn-wd" onclick="openTxn(${i},'out')">− ຖອນ</button>
        <button class="action-btn btn-edit" onclick="openEditGoal(${i})">✏️</button>
        <button class="action-btn btn-del" onclick="openDelete(${i})">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!txns.length){
    el.innerHTML=`<div class="empty"><div class="empty-pig">📭</div><div class="empty-title">ຍັງບໍ່ມີລາຍການ</div></div>`;
    return;
  }
  el.innerHTML=[...txns].reverse().map(t=>{
    const g=goals.find(x=>x.id===t.goalId);
    const isIn=t.type==='in', isKip=t.cur==='KIP';
    const sym=isKip?'₭':'฿';
    const icoCls=isIn?(isKip?'ki':'bi'):'out';
    const icoTxt=isIn?(isKip?'₭':'฿'):'↓';
    const amtCls=isIn?(isKip?'color:var(--kip)':'color:var(--baht)'):'color:var(--red)';
    const d=new Date(t.date);
    const ds=d.toLocaleDateString('lo-LA',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('lo-LA',{hour:'2-digit',minute:'2-digit'});
    return `
    <div class="history-item">
      <div class="hist-icon ${icoCls}">${icoTxt}</div>
      <div class="hist-info">
        <div class="hist-name">${g?g.emoji+' '+g.name:'ລຶບແລ້ວ'}${t.note?' • '+t.note:''}</div>
        <div class="hist-sub">${ds} • ${isKip?'ກີບ':'ບາດ'}</div>
      </div>
      <div class="hist-amt" style="${amtCls}">${isIn?'+':'-'}${sym}${t.amount.toLocaleString('en')}</div>
    </div>`;
  }).join('');
}

// ============================================================
//  CELEBRATE
// ============================================================
function celebrate(){
  const wrap=document.getElementById('cw');
  const cols=['#f4845f','#f7c948','#2d9c8e','#e74c3c','#27ae60','#1a6fb5','#9b59b6'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');
    c.className='cf';
    c.style.cssText=`left:${Math.random()*100}%;width:${5+Math.random()*9}px;height:${5+Math.random()*9}px;border-radius:${Math.random()>.5?'50%':'3px'};background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${.8+Math.random()*1.3}s;animation-delay:${Math.random()*.6}s;`;
    wrap.appendChild(c);
    setTimeout(()=>c.remove(),2800);
  }
}

// ============================================================
//  TOAST
// ============================================================
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ============================================================
//  INIT
// ============================================================
function init(){
  // sync slider values from saved settings
  document.getElementById('hueSlider').value=settings.hue;
  document.getElementById('satSlider').value=settings.sat;
  document.getElementById('litSlider').value=settings.lit;
  applyTheme();
  renderColorPresets();
  render();
}
init();
</script>
